name: Build
on:
  push:
    branches:
      - main
    paths:
      - app/**
  workflow_dispatch:

env:
  # Image Name - <account>/<repo> (aka neevgef/greenfield-python)
  IMAGE_NAME: ${{ github.repository }}
  APP_VERSION: 0.0.0 # default value, will be overwritten by VERSION file
  AWS_REGION: eu-west-2 # London
  AWS_ECR_REPOSITORY: image-registry
  AWS_CONTAINER_NAME: greenfield-python
  AWS_ECS_TASK_DEFINITION: .github/workflows/ecs-task-definition.json
  AWS_ECS_SERVICE: greenfield-python-service
  AWS_ECS_CLUSTER: greenfield-python-cluster

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      id-token: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      # Check out the repository
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7

      - name: Calculate semantic version
        id: version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch

      - name: Set application version
        run: |
          echo "APP_VERSION=${{ steps.version.outputs.new_version }}" >> "$GITHUB_ENV"
          echo "Release version: ${{ steps.version.outputs.new_version }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-github-actions
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Creates list of tags for build  
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}
          # Extract a tag for the commit sha
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},value=${{ env.APP_VERSION }}

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          context: ./app
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Inject the new image into the ECS task definition.
      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.AWS_ECS_TASK_DEFINITION }}
          container-name: ${{ env.AWS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

      # Deploy the new task definition to ECS.
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.AWS_ECS_SERVICE }}
          cluster: ${{ env.AWS_ECS_CLUSTER }}
          wait-for-service-stability: true
    
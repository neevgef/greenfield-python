name: Build
on:
  push:
    branches:
      - main
    paths:
      - app/**
  workflow_dispatch:

env:
  # Container Registry
  REGISTRY: ghcr.io
  # Image Name - <account>/<repo> (aka neevgef/greenfield-python)
  IMAGE_NAME: ${{ github.repository }}
  APP_VERSION: 0.0.0 # default value, will be overwritten by VERSION file
  AWS_REGION: eu-west-2 # London

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      # Check out the repository
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7

      - name: Calculate semantic version
        id: version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch

      - name: Set application version
        run: |
          echo "APP_VERSION=${{ steps.version.outputs.new_version }}" >> "$GITHUB_ENV"
          echo "Release version: ${{ steps.version.outputs.new_version }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-github-actions
          aws-region: ${{ env.AWS_REGION }}


      # Login against a registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Creates list of tags for build  
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Extract a tag for the commit sha
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},value=${{ env.APP_VERSION }}

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          context: ./app

    